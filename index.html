<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitura Diária WDO</title>
  <link rel="icon" href="icone.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;700&display=swap">
  <link rel="stylesheet" href="painel.css">
</head>

<body>
  <header>
    <h1>Leitura Diária WDO</h1>
    <nav id="tabs">
      <button data-tab="checklist" class="active">Pré-mercado</button>
      <button data-tab="trades">Trades</button>
      <button data-tab="week">Semana</button>
      <button data-tab="history">Histórico</button>
    </nav>
  </header>
  <!-- TradingView: faixa de cotações -->
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        { "proName": "CAPITALCOM:DXY", "title": "DXY" },
        { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" }
      ],
      "showSymbolLogo": false,
      "colorTheme": "dark",
      "isTransparent": true,
      "displayMode": "adaptive",
      "locale": "br"
    }
    </script>
  </div>

  <main>
    <div id="painel-wdo" class="qp">Carregando dados do WDO...</div>
    <script src="painel.js"></script>
  </main>

  <main>
    <section id="view-checklist" class="view active"></section>
    <section id="view-trades" class="view"></section>
    <section id="view-week" class="view"></section>
    <section id="view-history" class="view"></section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>

</html>
