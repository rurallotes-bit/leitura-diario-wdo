<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitura Diária WDO</title>
  <meta name="description" content="Leitura diária do mini dólar (WDO): força do mercado, níveis, notícias e leitura de gráfico em M1, M5, M15 e M240.">
  <meta name="theme-color" content="#02040a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Leitura Diária WDO">
  <meta property="og:description" content="Leitura diária do mini dólar (WDO) com níveis, notícias e gráficos em vários tempos.">
  <link rel="icon" href="icone.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;700&display=swap">
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="estrategia.css">
  <link rel="stylesheet" href="banco.css">
  <link rel="stylesheet" href="banco-escuro.css">
  <link rel="stylesheet" href="futuro.css?v=2">
  <link rel="stylesheet" href="legivel.css?v=1">
  <link rel="stylesheet" href="xp.css?v=1">
  <script>
    // Formato da tela: automático (PC a partir de 1200 px), PC ou celular
    (function () {
      var modo = 'auto';
      try { modo = localStorage.getItem('modoTela') || 'auto'; } catch (e) {}
      function aplicar() {
        var largo = modo === 'pc' || (modo === 'auto' && window.innerWidth >= 1200);
        document.documentElement.classList.toggle('largo', largo);
        // PC: layout de referência de 1440 px escalado para ocupar a tela toda (mesma proporção em qualquer monitor)
        document.documentElement.style.zoom = largo ? Math.max(1, window.innerWidth / 1440).toFixed(3) : '';
      }
      window.qpModoTela = {
        get: function () { return modo; },
        set: function (v) { modo = v; try { localStorage.setItem('modoTela', v); } catch (e) {} aplicar(); }
      };
      aplicar();
      window.addEventListener('resize', aplicar);
      var tema = 'escuro';
      try { tema = localStorage.getItem('temaTela') || 'escuro'; } catch (e) {}
      document.documentElement.classList.toggle('tema-claro', tema === 'claro');
    })();
  </script>
</head>

<body>
  <header>
    <h1>Leitura Diária WDO</h1>
    <button id="modoTela" class="modo-btn" type="button" title="Trocar o formato da tela">Tela: automática</button>
    <button id="temaTela" class="modo-btn" type="button" title="Trocar entre tema escuro e claro">Tema: escuro</button>
    <nav id="tabs">
      <button data-tab="checklist" class="active">Pré-mercado</button>
      <button data-tab="estrategia">Estratégia</button>
    </nav>
  </header>
  <!-- Faixa única de cotações, rolando junta: TradingView (US10Y, DXY, S&P 500) + WIN vigente e DI1 (MT5).
       O conteúdo existe duas vezes só para o loop ser contínuo; cada cópia ocupa a tela inteira,
       então nenhum ativo aparece repetido ao mesmo tempo. -->
  <div class="fx-topo">
    <div class="fx-fita">
      <div class="fx-fita-faixa">
        <div class="fx-fita-copia">
          <div class="tradingview-widget-container fx-tv">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-tickers.js" async>
            {
              "symbols": [
                { "proName": "CAPITALCOM:DXY", "title": "DXY" },
                { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" }
              ],
              "showSymbolLogo": false,
              "colorTheme": "dark",
              "isTransparent": true,
              "locale": "br"
            }
            </script>
          </div>
          <div class="fx-di"><span>DI1: carregando…</span></div>
        </div>
        <div class="fx-fita-copia" aria-hidden="true">
          <div class="tradingview-widget-container fx-tv">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-tickers.js" async>
            {
              "symbols": [
                { "proName": "CAPITALCOM:DXY", "title": "DXY" },
                { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" }
              ],
              "showSymbolLogo": false,
              "colorTheme": "dark",
              "isTransparent": true,
              "locale": "br"
            }
            </script>
          </div>
          <div class="fx-di"><span>DI1: carregando…</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // cabeçalho e faixa de cotações ficam fixos no topo; o cartão de cotação gruda abaixo deles
    (function () {
      var cab = document.querySelector('header'), faixa = document.querySelector('.fx-topo');
      function medir() {
        var h = cab.offsetHeight;
        faixa.style.top = h + 'px';
        document.documentElement.style.setProperty('--topo-h', (h + faixa.offsetHeight) + 'px');
      }
      medir();
      if ('ResizeObserver' in window) new ResizeObserver(medir).observe(faixa);
      window.addEventListener('resize', medir);
    })();
  </script>

  <main>
    <div id="painel-wdo" class="qp">Carregando dados do WDO...</div>
    <script src="painel.js"></script>
    <section id="view-checklist" class="view active"></section>
    <section id="view-estrategia" class="view"></section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
  <script src="estrategia.js"></script>
  <script src="futuro.js?v=2"></script>
  <script>
    (function () {
      var b = document.getElementById('modoTela'), ordem = ['auto', 'pc', 'cel'];
      var nome = { auto: 'Tela: automática', pc: 'Tela: PC', cel: 'Tela: celular' };
      function mostrar() { b.textContent = nome[qpModoTela.get()] || nome.auto; }
      var t = document.getElementById('temaTela');
      function mostrarTema() { t.textContent = document.documentElement.classList.contains('tema-claro') ? 'Tema: claro' : 'Tema: escuro'; }
      t.onclick = function () {
        var claro = !document.documentElement.classList.contains('tema-claro');
        document.documentElement.classList.toggle('tema-claro', claro);
        try { localStorage.setItem('temaTela', claro ? 'claro' : 'escuro'); } catch (e) {}
        mostrarTema();
      };
      mostrarTema();
      b.onclick = function () {
        var i = ordem.indexOf(qpModoTela.get());
        qpModoTela.set(ordem[(i + 1) % ordem.length]);
        mostrar();
      };
      mostrar();
    })();
  </script>
</body>

</html>
